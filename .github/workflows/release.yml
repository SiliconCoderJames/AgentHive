name: Release

# 推 v* 标签即出包；也可在 Actions 页面手动触发并指定版本号。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.0.0，可带 v 前缀）'
        required: true
        default: '1.0.0'

permissions:
  contents: write   # 创建 Release 并上传资产

jobs:
  windows-release:
    name: Build + package + publish (Windows x64)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}' }
          if ([string]::IsNullOrWhiteSpace($v)) { throw 'cannot resolve version' }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "release version: $v"

      - name: Package (build, stage, self-check, MSI + ICE, ZIP, checksums)
        shell: pwsh
        run: |
          # -QtPrefix 指向 install-qt-action 安装的 Qt；生成器用 runner 上存在的 VS 2022
          powershell -ExecutionPolicy Bypass -File scripts\package.ps1 `
            -Version "${{ steps.ver.outputs.version }}" `
            -QtPrefix "$env:QT_ROOT_DIR" `
            -Generator "Visual Studio 17 2022"

      - name: Unit tests
        shell: pwsh
        run: |
          ctest --test-dir build/full -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "unit tests failed - not publishing" }

      - name: Show artifacts
        shell: pwsh
        run: Get-ChildItem release -File | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}} | Format-Table -AutoSize

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AgentHive-windows-x64
          path: |
            release/*.msi
            release/*.zip
            release/SHA256SUMS.txt
            release/latest.json
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = "${{ steps.ver.outputs.version }}" -replace '^v', ''
          $tag = "v$ver"
          $msi = "release/AgentHive-$ver-x64.msi"
          $zip = "release/AgentHive-$ver-win64-portable.zip"
          $sums = "release/SHA256SUMS.txt"
          # latest.json is what the in-app updater fetches
          # (https://github.com/<repo>/releases/latest/download/latest.json) - it must be
          # published with every release or auto-update stops working.
          $manifest = "release/latest.json"
          foreach ($f in @($msi, $zip, $sums, $manifest)) {
            if (-not (Test-Path $f)) { throw "missing artifact: $f" }
          }
          # Release notes live in the repo so a manual release and a CI release show the same
          # text: release/RELEASE_NOTES-<ver>.md (fallback below when the file is absent).
          $notesFile = "release/RELEASE_NOTES-$ver.md"
          if (Test-Path $notesFile) {
            $notes = Get-Content $notesFile -Raw
            Write-Host "using release notes from $notesFile"
          } else {
            $notes = @"
          ## AgentHive $ver

          Local-first collaboration hub for AI agents, Windows x64 build.

          * ``AgentHive-$ver-x64.msi`` - per-user install (no administrator rights)
          * ``AgentHive-$ver-win64-portable.zip`` - unzip and run ``agenthive.exe``
          * ``SHA256SUMS.txt`` - checksums

          The binaries are **not code-signed**, so SmartScreen may warn on first launch.
          Your data lives in ``%USERPROFILE%\.agenthive`` and is **not** removed on uninstall.

          See ``release/RELEASE_NOTES-$ver.md`` for the full notes.
          "@
          }
          # Tags containing '-' (e.g. v1.0.1-rc1) are published as pre-releases
          $pre = @()
          if ($ver -match '-') { $pre = @('--prerelease') }

          # 已存在同标签的 Release 时直接补充资产，避免重复创建失败
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $msi $zip $sums $manifest --clobber
            gh release edit $tag --notes $notes @pre
          } else {
            # --target 让新建的标签指向本次实际构建的 commit（workflow_dispatch 手动触发时
            # 标签还不存在，不加会把标签打到默认分支头上，产物与 commit 对不上）
            gh release create $tag $msi $zip $sums $manifest `
              --title "AgentHive $ver" --notes $notes --target $env:GITHUB_SHA @pre
          }
